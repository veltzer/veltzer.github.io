# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "veltzer.github.io"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML",
    "Pillow",
    "beautifulsoup4",
    "pydatacheck",
    # pydatacheck imports pylogconf but does not declare it; remove once it does.
    "pylogconf",
    "requests",
    "ruamel.yaml",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-beautifulsoup4",
    "types-PyYAML",
    "types-requests",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Tests import from here: the scripts under test are standalone executables, not an installed package.
pythonpath = ["scripts"]
