# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "veltzer.github.io"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML",
    "Pillow",
    "beautifulsoup4",
    "pydatacheck",
    # pydatacheck imports pylogconf but does not declare it; remove once it does.
    "pylogconf",
    "requests",
    "ruamel.yaml",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-beautifulsoup4",
    "types-PyYAML",
    "types-requests",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    "scripts",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "PIL.*",
]

[tool.pytest.ini_options]
# Tests import from here: the scripts under test are standalone executables, not an installed package.
pythonpath = ["scripts"]
