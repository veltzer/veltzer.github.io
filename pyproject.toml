# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "veltzer.github.io"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML",
    "Pillow",
    "numpy",
    "requests",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-PyYAML",
    "types-requests",
]

[tool.uv]
# The personal website: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
search-path = [
    "scripts",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "PIL.*",
]

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
# Tests import from here: the scripts under test are standalone executables, not an installed package.
pythonpath = ["scripts"]
