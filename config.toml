base_url = "https://veltzer.org"
title = "Mark Veltzer's personal site"
author = "Mark Veltzer"

default_language = "en"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

# Nav labels, keyed so base.html can render them in the reading language.
# Zola's trans() looks these up per language; the English table below is the
# fallback for any key a language has not translated.
[translations]
nav_blog = "Blog"
nav_about = "About"
nav_tags = "Tags"
nav_media = "Media"
nav_calendar = "Calendar"
nav_chess = "Chess"
nav_slides = "Slides"
nav_syllabi = "Syllabi"
nav_animations = "Animations"

# Hebrew. Posts opt in by filename: foo.he.md alongside foo.md. Zola serves
# them under /he/ and exposes page.translations, which templates/page.html
# turns into a language switcher -- no hand-maintained cross-links.
[languages.he]
title = "האתר האישי של מארק ולצר"
generate_feeds = true
build_search_index = false  # the default index is tuned for latin scripts
taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

# The apps (media/chess/...) exist only in English, but their nav labels are
# still worth translating: the reader on /he/ sees a Hebrew menu even though
# the app itself opens in English.
[languages.he.translations]
nav_blog = "בלוג"
nav_about = "אודות"
nav_tags = "תגיות"
nav_media = "מדיה"
nav_calendar = "יומן"
nav_chess = "שחמט"
nav_slides = "מצגות"
nav_syllabi = "סילבוסים"
nav_animations = "אנימציות"

# Taxonomy slugs keep their UTF-8 characters instead of being transliterated.
# Zola's default slugify turns a Hebrew tag into unreadable latin -- archaeology
# in Hebrew becomes "rky-vlvgyh" -- which is neither readable nor searchable.
# "safe" only strips characters that are illegal in a path, so /he/tags/ gets
# real Hebrew URLs. This affects taxonomies ONLY: `paths` and `anchors` stay on
# the default so the 80 existing post URLs, which come from ASCII filenames, do
# not move.
[slugify]
taxonomies = "safe"

[markdown]
smart_punctuation = false
render_emoji = true

# Fenced code blocks in the older sysadmin posts rely on highlighting.
# Zola 0.23 moved this under its own table; `highlight_code` is gone.
# Zola 0.23 switched to the `giallo` highlighter; the old syntect theme names
# (base16-*, "Solarized (light)") no longer resolve. Dual themes so code blocks
# follow the reader's colour scheme, matching the CSS.
[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
rss_url = "https://veltzer.org/atom.xml"
# Drives the site-level language switcher in base.html. Adding a language here
# plus a [languages.xx] block above is all a new language needs.
languages = [
    { code = "en", name = "English" },
    { code = "he", name = "עברית" },
]
# Drives the theme <select> in the header. Names come from shared-themes'
# themes.yaml; azure is the default and is applied by :root, so a reader who
# never touches the switcher gets it without any JS running.
themes = [
    { code = "azure", name = "Azure" },
    { code = "paper", name = "Paper" },
    { code = "midnight", name = "Midnight" },
    { code = "nord", name = "Nord" },
    { code = "solarized", name = "Solarized" },
    { code = "rosepine", name = "Rosé Pine" },
]
# `path` is relative to the language root, and the template prefixes it with
# /en/ or /he/. Entries marked `app = true` are single-language applications
# rather than writing, so they live at the site root and take no prefix.
nav = [
    { key = "nav_blog", path = "blog/" },
    { key = "nav_about", path = "about/" },
    { key = "nav_tags", path = "tags/" },
    { key = "nav_media", path = "media/", app = true },
    { key = "nav_calendar", path = "calendar/", app = true },
    { key = "nav_chess", path = "chess/", app = true },
    { key = "nav_slides", path = "slides/", app = true },
    { key = "nav_syllabi", path = "syllabi/", app = true },
    { key = "nav_animations", path = "animations/", app = true },
]
