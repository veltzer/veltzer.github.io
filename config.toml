base_url = "https://veltzer.org"
title = "Mark Veltzer's personal site"
author = "Mark Veltzer"

# The default language is "cs", and there is deliberately not one word of Czech
# on this site.
#
# Zola identifies the default language by the ABSENCE of a filename marker:
# foo.md is the default language and foo.he.md is a translation. There is no way
# to write foo.en.md while "en" is the default -- zola parses the ".en" as part
# of the slug and silently builds /blog/foo-en/ instead, with the translation
# pairing severed and exit code 0. Declaring [languages.en] does not help; with
# a title it is a hard error ("specified twice"), and bare it changes nothing.
#
# Pointing default_language at a language that has no content sidesteps that:
# every real language is then a non-default one, so every file carries an
# explicit suffix and English stops being a special case. The cost is the
# [translations] table below and the /index.html redirect, both of which exist
# only to service a language nobody reads.
#
# build_search_index is off here for the same reason: zola only ships stemmers
# for a fixed list of languages and errors out on an unsupported one. The real
# languages set it in their own blocks.
default_language = "cs"
compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

# Nav labels for the default language -- which is the empty "cs" (see the top of
# this file). trans() falls back here for any key a real language has not
# translated, and zola errors out if a key it needs is missing entirely, so this
# table has to exist and has to be complete. The values are English because a
# fallback that renders is better than one that does not; nothing should ever
# actually reach them.
[translations]
nav_blog = "Blog"
nav_about = "About"
nav_tags = "Tags"
nav_media = "Media"
nav_calendar = "Calendar"
nav_chess = "Chess"
nav_slides = "Slides"
nav_syllabi = "Syllabi"
nav_animations = "Animations"

# UI chrome outside the nav: taxonomy headings, pagination, the home page and
# the accessible labels on the two header selects.
tags_title = "Tags"
tagged_with = "Tagged"
latest_posts = "Latest posts"
all_posts = "All posts"
newer = "Newer"
older = "Older"
label_language = "Language"
label_theme = "Theme"
label_translations = "Translations"
stats_title = "Archive"
stats_posts = "posts"
stats_in_languages = "in 2 languages"
stats_by_year = "By year"
stats_year = "Year"
stats_count = "Posts"
built_from_commit = "Built from commit"
built_on_date = "on"
built_dirty = "with uncommitted changes"

# English. Posts are foo.en.md; see the default_language note at the top for why
# the suffix is explicit rather than English being the unmarked default.
[languages.en]
title = "Mark Veltzer's personal site"
generate_feeds = true
# Off, not because zola cannot index English -- it can, unlike Hebrew -- but
# because nothing on the site ever loaded the result. It generated
# search_index.en.js at 4.1 MB plus elasticlunr.min.js on every build, deployed
# both, and no page script-tagged either. The only search here is the media
# app's, which filters its own JSON client-side and does not use this at all.
#
# Flip to true and add a UI if blog search is ever wanted; the index is the
# easy half. Both languages are now false, which at least makes them
# consistent.
build_search_index = false
taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

[languages.en.translations]
nav_blog = "Blog"
nav_about = "About"
nav_tags = "Tags"
nav_media = "Media"
nav_calendar = "Calendar"
nav_chess = "Chess"
nav_slides = "Slides"
nav_syllabi = "Syllabi"
nav_animations = "Animations"
tags_title = "Tags"
tagged_with = "Tagged"
latest_posts = "Latest posts"
all_posts = "All posts"
newer = "Newer"
older = "Older"
label_language = "Language"
label_theme = "Theme"
label_translations = "Translations"
stats_title = "Archive"
stats_posts = "posts"
stats_in_languages = "in 2 languages"
stats_by_year = "By year"
stats_year = "Year"
stats_count = "Posts"
built_from_commit = "Built from commit"
built_on_date = "on"
built_dirty = "with uncommitted changes"

# Hebrew. Posts opt in by filename: foo.he.md alongside foo.en.md. Zola serves
# them under /he/ and exposes page.translations, which templates/page.html
# turns into a language switcher -- no hand-maintained cross-links.
[languages.he]
title = "האתר האישי של מארק ולצר"
generate_feeds = true
build_search_index = false  # the default index is tuned for latin scripts
taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

# The apps (media/chess/...) exist only in English, but their nav labels are
# still worth translating: the reader on /he/ sees a Hebrew menu even though
# the app itself opens in English.
[languages.he.translations]
nav_blog = "בלוג"
nav_about = "אודות"
nav_tags = "תגיות"
nav_media = "מדיה"
nav_calendar = "יומן"
nav_chess = "שחמט"
nav_slides = "מצגות"
nav_syllabi = "סילבוסים"
nav_animations = "אנימציות"

tags_title = "תגיות"
tagged_with = "מתויג"
latest_posts = "הפוסטים האחרונים"
all_posts = "כל הפוסטים"
newer = "חדשים יותר"
older = "ישנים יותר"
label_language = "שפה"
label_theme = "ערכת נושא"
label_translations = "תרגומים"
stats_title = "ארכיון"
stats_posts = "פוסטים"
stats_in_languages = "בשתי שפות"
stats_by_year = "לפי שנה"
stats_year = "שנה"
