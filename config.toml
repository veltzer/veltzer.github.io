base_url = "https://veltzer.org"
title = "Mark Veltzer's personal site"
author = "Mark Veltzer"

default_language = "en"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

# Hebrew. Posts opt in by filename: foo.he.md alongside foo.md. Zola serves
# them under /he/ and exposes page.translations, which templates/page.html
# turns into a language switcher -- no hand-maintained cross-links.
[languages.he]
title = "האתר האישי של מארק ולצר"
generate_feeds = true
build_search_index = false  # the default index is tuned for latin scripts
taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

[markdown]
smart_punctuation = false
render_emoji = true

# Fenced code blocks in the older sysadmin posts rely on highlighting.
# Zola 0.23 moved this under its own table; `highlight_code` is gone.
# Zola 0.23 switched to the `giallo` highlighter; the old syntect theme names
# (base16-*, "Solarized (light)") no longer resolve. Dual themes so code blocks
# follow the reader's colour scheme, matching the CSS.
[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
rss_url = "https://veltzer.org/atom.xml"
# Drives the site-level language switcher in base.html. Adding a language here
# plus a [languages.xx] block above is all a new language needs.
languages = [
    { code = "en", name = "English" },
    { code = "he", name = "עברית" },
]
# Drives the theme <select> in the header. Names come from shared-themes'
# themes.yaml; azure is the default and is applied by :root, so a reader who
# never touches the switcher gets it without any JS running.
themes = [
    { code = "azure", name = "Azure" },
    { code = "paper", name = "Paper" },
    { code = "midnight", name = "Midnight" },
    { code = "nord", name = "Nord" },
    { code = "solarized", name = "Solarized" },
    { code = "rosepine", name = "Rosé Pine" },
]
# `path` is relative to the language root: the template prefixes it with /en/
# or /he/. Absolute URLs would break, since English now lives under /en/.
nav = [
    { name = "Blog", path = "blog/" },
    { name = "About", path = "about/" },
    { name = "Tags", path = "tags/" },
    { name = "Media", path = "media/" },
    { name = "Calendar", path = "calendar/" },
    # chess.html is a standalone app page under static/, not a content/ section,
    # so it needs an explicit entry -- it was unreachable by navigation until now.
    { name = "Chess", path = "chess/" },
    { name = "Board", path = "board/" },
    { name = "Slides", path = "slides/" },
    { name = "Syllabi", path = "syllabi/" },
    { name = "Animations", path = "animations/" },
]
