# rssite configuration. Every key here is known to the generator; an unknown
# key is an error, never an ignored line. The directory keys keep their
# defaults (content/, templates/, static/, sass/, i18n/, _site/).

base_url = "https://veltzer.org"
title = "Mark Veltzer's personal site"
author = "Mark Veltzer"
description = "Mark Veltzer -- software engineer from Israel. Blog on programming, Linux and philosophy, plus chess games, media notes and teaching material."

# Both languages are explicit and symmetrical: every content file carries a
# language suffix (post.en.md, post.he.md) and every language is served under
# its own prefix (/en/, /he/). There is no default language. English is only
# the fallback for the root redirect and the global 404.html, which a static
# host cannot negotiate.
fallback_language = "en"

[[languages]]
code = "en"
name = "English"
direction = "ltr"
locale = "en_US"
# Listings show "2 Sep 2026", a post header "2 September 2026".
date_format = "%-d %b %Y"
date_format_long = "%-d %B %Y"
title = "Mark Veltzer's personal site"
description = "Mark Veltzer -- software engineer from Israel. Blog on programming, Linux and philosophy, plus chess games, media notes and teaching material."
generate_feeds = true

[[languages]]
code = "he"
name = "עברית"
direction = "rtl"
locale = "he_IL"
# "2 בספטמבר 2026": the ב prefix is how Hebrew says "on the 2nd of
# September". Hebrew has no month abbreviations in common use, so the long
# form is the only one.
date_format = "%-d ב%B %Y"
title = "האתר האישי של מארק ולצר"
description = "מארק ולצר -- מהנדס תוכנה מישראל. בלוג על תכנות, לינוקס ופילוסופיה, לצד משחקי שחמט, המלצות מדיה וחומרי הוראה."
generate_feeds = true

# The one taxonomy. A post and its translation list the same tags in the
# same order, so rssite pairs them by position (religion <-> דת) and a tag
# page links to the same tag in the other language. A pair of posts whose
# lists differ in length or order fails the build.
[[taxonomies]]
name = "tags"
feed = true
paginate_by = 20
infer_translations = true

[slugify]
# Hebrew tags keep their letters in the URL (/he/tags/דת/); post URLs come
# from ASCII file names either way.
paths = "safe"
taxonomies = "safe"
anchors = "safe"

[markdown]
smart_punctuation = false
highlight = true
highlight_theme = "InspiredGitHub"

[feeds]
# A feed is a "what's new" window, not an archive; the blog index has the rest.
limit = 20
# The English feed is also served at /atom.xml: until 2026-09-21 every
# page advertised that URL, and GitHub Pages cannot redirect a subscriber.
root = true

[sitemap]
enabled = true

# The shared design tokens, switcher and fonts, published from the submodule
# beside the generated pages; templates/base.html links them.
[[publish]]
from = "shared/shared-themes"
to = "shared-themes"
files = ["themes.css", "fonts.css", "theme-switcher.js", "fonts/*"]

[extra]
google_analytics_id = "G-LXVE94D5KX"
# The header navigation: each entry is a translation key and a path below the
# language prefix, so every item follows the reader's language, apps included.
nav = [
    { key = "nav_blog", path = "blog/" },
    { key = "nav_tags", path = "tags/" },
    { key = "nav_media", path = "media/" },
    { key = "nav_calendar", path = "calendar/" },
    { key = "nav_chess", path = "chess/" },
    { key = "nav_slides", path = "slides/" },
    { key = "nav_syllabi", path = "syllabi/" },
    { key = "nav_animations", path = "animations/" },
    { key = "nav_training", path = "training/" },
    { key = "nav_about", path = "about/" },
]

# Legacy URLs that Google still holds, mapped to the page that serves the
# same content today. Every one was reported as "Not found (404)" in Search
# Console. rssite fails the build when a target is not a file it writes, so
# a target renamed since cannot quietly become a redirect to a 404.
#
# Two generations of URL are represented:
#
#   * MkDocs-era permalinks, /YYYY/MM/DD/<slug-from-title>/. The slug came
#     from the post title, so a later retitling stranded the old URL even
#     though the post never went anywhere.
#   * Root-level zola URLs from before English moved under /en/ (2026-08).
#     These differ from the live URL by that one path segment.
#
# Redirects rather than resurrected pages: what the old URL owes a visitor
# is the way there, and what it owes Google is the signal that consolidates
# the two into one ranking. GitHub Pages serves static files only, so each
# is a meta-refresh page with rel=canonical and `noindex, follow`, which is
# what Google documents for exactly this case. The old blog pagination
# (/page/N/) is `pager_aliases` in content/blog/_index.en.md, which covers
# every pager the archive has rather than a hand-kept list.

[[redirects]]
from = "2026/03/29/linux-io_uring-vs-windows-io-a-technical-comparison"
to = "/en/blog/linux-io-uring-vs-windows-io/"

[[redirects]]
from = "2026/04/14/why-wont-god-heal-amputees"
to = "/en/blog/amputees-never-regrow/"

[[redirects]]
from = "2026/05/06/vicarious-atonement-punishing-the-innocent-to-forgive-the-guilty"
to = "/en/blog/vicarious-atonement/"

[[redirects]]
from = "2026/05/13/what-divine-command-theory-actually-implies"
to = "/en/blog/divine-command-theory-problems/"

[[redirects]]
from = "2026/05/18/what-brain-damage-tells-us-about-the-soul"
to = "/en/blog/brain-damage-disproves-the-soul/"
# Reported 2026-09-16 as Not found (404). A retitling stranded each of
# these the same way the five above were stranded: the MkDocs permalink
