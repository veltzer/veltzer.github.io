{% extends "base.html" %}
{% block title %}{{ trans(key="tags_title") }} &middot; {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ trans(key="tags_title") }}</h1>
<ul class="tag-cloud">
  {%- for term in terms %}
  <li><a class="tag" href="{{ term.permalink }}">{{ term.name }}</a> <span class="count">{{ term.page_count }}</span></li>
  {%- endfor %}
</ul>
{% endblock %}
