# Node packages (stylelint and its postcss-scss syntax) are not listed
# here: they come from package.json / package-lock.json, which
# `tools install-deps` installs with `npm ci`.
[dependencies]
system = ["libxml2-utils", "aspell", "aspell-en", "aspell-he"]

[processor.eslint]
src_dirs = ["static"]
src_exclude_dirs = ["vendor"]
args = ["-c", ".eslint.config.js"]
[processor.tidy]
src_dirs = ["static"]
# not linted: templates (zola templates, not standalone HTML)
[processor.htmlhint]
src_dirs = ["static"]

[processor.explicit]
command = "scripts/build_site.py"
required_tools = ["zola"]
# The command itself and the scripts it invokes: rsconstruct hashes the command
# string, not the file it names, so without these a change to the
# post-processing in build_site.py would not invalidate a warm cache.
inputs = [
    "config.toml",
    "scripts/build_site.py",
    "scripts/gen_stats.py",
    "scripts/import_companies.py",
    "scripts/import_teaching.py",
]
# data/ feeds the companies tab: organizations.yaml becomes
# _site/data/companies.json.gz and data/logos/ is copied to _site/logos/.
input_globs = [
    "content/**/*",
    "templates/**/*",
    "sass/**/*",
    "static/**/*",
    "data/**/*",
]
output_dirs = [ "_site" ]
[processor.ruff]
src_dirs = ["scripts", "tests"]
[processor.mypy]
src_dirs = ["scripts", "tests"]
[processor.pytest]
src_dirs = ["tests"]
# Everything the tests import or read, so an edit to any of it re-runs the
# suite on a warm cache. There is no glob form, hence every template by name;
# tests/test_template_determinism.py reads all of templates/*.html.
dep_inputs = [
    "scripts/build_site.py",
    "scripts/csv_to_yaml.py",
    "scripts/gen_stats.py",
    "scripts/import_audible.py",
    "scripts/import_books.py",
    "scripts/import_companies.py",
    "templates/404.html",
    "templates/_date.html",
    "templates/app.html",
    "templates/app_body.html",
    "templates/atom.xml",
    "templates/base.html",
    "templates/blog.html",
    "templates/chess.html",
    "templates/embed.html",
    "templates/index.html",
    "templates/page.html",
    "templates/section.html",
    "templates/taxonomy_list.html",
    "templates/taxonomy_single.html",
]
[analyzer.markdown]

[analyzer.tera]
# ─── data ────────────────────────────────────────────────────────────────────
# data/yaml is the source of truth for the media tracker and the profile block
# (it used to live in the private ../data repo). The four checks it had there
# came with it: lint, schema validation ($schema in each file), a JSON
# conversion that proves every file parses, and pydatacheck's cross-checks
# against imdb / goodreads / simania, which read their caches from shelve/.
[processor.yamllint]
src_dirs = [".github", "data/yaml"]
dep_inputs = [".yamllint.yaml"]

[processor.iyamlschema]
src_dirs = ["data/yaml"]

[processor.yaml2json]
src_dirs = ["data/yaml"]

[processor.script.check_videos]
src_files = ["data/yaml/video_series.yaml", "data/yaml/video_features.yaml"]
command = "pydatacheck"
args = ["check_videos"]
batch = true

[processor.script.check_books]
src_files = ["data/yaml/books_read.yaml"]
command = "pydatacheck"
args = ["check_books"]
[processor.taplo]
src_files = ["config.toml", "rsconstruct.toml", ".rumdl.toml", ".rumdl.zola.toml", "pyproject.toml", "static/identity.toml", "static/tag_translations.toml"]

[processor.encoding]
src_dirs = ["scripts", "static", "templates", "sass"]
src_exclude_dirs = ["vendor"]
[processor.stylelint]
command = "stylelint"
src_dirs = ["sass", "static"]
src_exclude_dirs = ["vendor"]
dep_inputs = [".stylelintrc.json"]
# not linted: static/vendor (vendored cm-chessboard and chess.js)
# content/{animations,slides,syllabi}/_index.en.md are generated by
# scripts/import_teaching.py from the built teaching-* sites: they inline
# each upstream page's <style>, and rumdl reads those CSS selectors as
# headings. They are build output, not authored markdown.
[processor.rumdl.prose]
src_dirs = ["doc"]
src_files = ["README.md", "CLAUDE.md"]
dep_inputs = [".rumdl.toml"]
src_exclude_dirs = ["content"]

# content/ is Zola pages: the H1 comes from the frontmatter title via
# templates/page.html, so they are linted with the zola-dialect config.
# The three imported app pages are generated by scripts/import_teaching.py
# and inline the upstream sites' <style>, which rumdl reads as headings.
[processor.rumdl.content]
src_dirs = ["content"]
args = ["--config", ".rumdl.zola.toml"]
dep_inputs = [".rumdl.zola.toml"]
src_exclude_paths = [
	"content/animations/_index.en.md",
	"content/slides/_index.en.md",
	"content/syllabi/_index.en.md",
]

[processor.ijsonlint]
src_files = ["package.json", ".stylelintrc.json"]
src_exclude_dirs = ["shared", "node_modules", "_site"]
src_exclude_files = ["package-lock.json"]
[processor.duplicate_files]
src_dirs = ["static/images"]
src_extensions = [".jpg", ".jpeg", ".png", ".gif", ".webp"]
# data/logos/*.svg are the organization logos organizations.yaml points at
# (paths in that file are relative to data/): well-formed XML via xmllint,
# valid SVG via svglint. The bitmaps they were traced from are in
# data/raw/logos/ and are not checked.
[processor.xmllint]
src_dirs = ["static", "data/logos"]
src_exclude_dirs = ["vendor"]
[processor.svglint]
src_dirs = ["data/logos"]
[processor.generator.aspell_he_dict]
command = "scripts/build_he_dict.sh"
src_files = [".aspell.he.txt"]
output_dir = "out/aspell"
output_extension = "rws"
[processor.script.spellcheck_he]
command = "scripts/spellcheck_he.sh"
src_dirs = ["content/blog"]
src_extensions = [".he.md"]
dep_auto = [".aspell.he.txt"]
[processor.generator.aspell_en_dict]
command = "scripts/build_en_dict.sh"
src_files = [".aspell.en.txt"]
output_dir = "out/aspell"
output_extension = "rws"
[processor.script.spellcheck_en]
command = "scripts/spellcheck_en.sh"
src_dirs = ["content/blog"]
src_extensions = [".en.md"]
dep_auto = [".aspell.en.txt"]

[pages]
dir = "_site"

[build]
parallel = 0

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts"]
