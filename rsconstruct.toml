[dependencies]
# libxml2-utils provides xmllint. The aspell packages are NOT listed here: the
# presence check in `tools install-deps` misfires on packages that ship no
# binary and silently skipped aspell-en, so .github/workflows/build.yml installs
# the dictionaries with apt directly.
#
# Retested 2026-08-19 by listing all three here and deleting the workflow step
# (run 32261194301). It still fails, and the log shows exactly why:
#
#   Already installed (skipping):
#     [system] aspell
#     [system] aspell-en        <- false; the runner had neither
#   [apt] libxml2-utils, aspell-he
#
# aspell then arrived only as a dependency of aspell-he, so English alone
# broke: "/usr/lib/aspell/en.dat is missing". The cause is in rsconstruct --
# dpkg-query exits 0 for a package it merely knows about ("unknown ok
# not-installed") and the presence check reads only that exit code. Until that
# is fixed upstream, this list cannot hold the aspell packages.
system = ["libxml2-utils"]
pip = [
  # No mkdocs packages: the site is built by zola, a single static binary
  # installed in the workflow. What remains is only what the linters and tests
  # need.
  # Needed by the mypy/pytest processors below. This list is the only source of
  # Python dependencies -- there is no requirements.txt -- so without these mypy
  # reports missing stubs for yaml and a missing PIL, and the tests cannot
  # import yaml.
  "types-PyYAML",
  "PyYAML",
  "Pillow",
  "pytest",
  # fetch_audiocourse_images.py parses og:image with BeautifulSoup; types-* gives
  # mypy the stubs.
  "beautifulsoup4",
  "types-beautifulsoup4",
  # Pin is load-bearing. Unpinned, CI resolves a newer pylint that rejects
  # .pylintrc's suggestion-mode option, so the build fails on a config that
  # 3.3.8 accepts. Bump this only together with .pylintrc.
  "pylint==3.3.8",
  # Unpinned deliberately: there is no ruff.toml to fall out of step with, so a
  # newer ruff can only fail by adding a lint that scripts/ then has to satisfy
  # -- which is the point of running it.
  "ruff",
]
# stylelint needs postcss-scss to parse .scss (customSyntax in
# .stylelintrc.json). Both are listed here so `tools install-deps` installs
# them, which puts them in the same global tree -- and that is exactly what
# makes the resolution work: stylelint resolves customSyntax relative to its
# own install tree, so a global stylelint finds a global postcss-scss as a
# sibling. Verified by removing node_modules entirely and building: stylelint
# processed all three stylesheets and still caught an injected
# color-no-invalid-hex.
npm = ["stylelint", "postcss-scss"]
# No system = ["python3-tk"] here: it does not help. CI uses actions/setup-python,
# which supplies its own interpreter that cannot see the distro's python3-tk, so
# the package installs (rsconstruct even reports it satisfied) while `import
# tkinter` still fails. tkinter and PIL are listed in .pylintrc ignored-modules
# instead, alongside cv2 -- the same treatment the project already gives modules
# that are not resolvable in every environment. image_picker.py and
# fetch_audiocourse_images.py are interactive desktop tools that cannot run
# headless on CI anyway; only their static analysis matters there.

# static/ holds the hand-written JS: the media app and its per-type plugins.
# (Was "blog", the MkDocs-era source dir -- it no longer exists, so eslint
# silently checked nothing.) vendor/ is excluded: cm-chessboard and chess.min.js
# are third-party and not ours to lint.
[processor.eslint]
src_dirs = ["static"]
src_exclude_dirs = ["vendor"]
args = ["-c", "config/eslint.config.js"]

# Only static/ -- the standalone app pages, which are real standalone HTML.
# templates/ is deliberately NOT checked: those are Tera, and tidy parses
# "{% if %}" as malformed markup ('attribute "{%" lacks value'), so pointing it
# there produces noise about the template language rather than about the HTML.
[processor.tidy]
src_dirs = ["static"]

# Complements tidy rather than duplicating it: tidy checks markup well-formedness
# (unclosed tags, nesting), htmlhint checks semantics tidy ignores -- duplicate
# id attributes, <img> without alt, unsafe target="_blank". Same scope and same
# reason for excluding templates/.
[processor.htmlhint]
src_dirs = ["static"]

# Zola build. Posts live in content/ -- the blog/posts -> content/blog converter
# was retired because it wiped content/blog on every run.
[processor.explicit]
command = "scripts/build_site.py"
inputs = [
    "config.toml",
    # build_site.py runs this to recompute the archive stats into
    # content/blog/_index.*.md before zola reads them. Listed so editing the
    # generator rebuilds the site rather than leaving stale numbers behind the
    # cache.
    "scripts/gen_stats.py",
]
input_globs = [
    "content/**/*",
    "templates/**/*",
    "sass/**/*",
    "static/**/*",
]
output_dirs = [ "_site" ]

# .pylintrc and .mypy.ini already existed but nothing ran them. Both pass clean,
# so wiring them in keeps that true rather than letting it rot.
[processor.pylint]
src_dirs = ["scripts"]
args = ["--rcfile=.pylintrc"]

# Ruff runs on defaults -- no ruff.toml. scripts/ is already clean under them,
# and shared-themes wires ruff the same bare way, so the two repos stay
# consistent. Ruff overlaps pylint but is not a replacement: pylint's .pylintrc
# here carries the ignored-modules list (tkinter, PIL, cv2) that keeps the
# desktop-only tools analysable, so both stay.
[processor.ruff]
src_dirs = ["scripts"]

# dep_auto defaults to "mypy.ini"; this project's file is ".mypy.ini", so the
# config has to be passed explicitly and declared as a dependency by hand.
[processor.mypy]
src_dirs = ["scripts"]
args = ["--config-file=.mypy.ini"]
dep_inputs = [".mypy.ini"]

# Tests for the data import scripts. They transform ~29,000 records, so a silent
# regression there corrupts the media database without failing the build.
# dep_inputs lists the scripts under test so edits to them re-run the suite.
[processor.pytest]
src_dirs = ["tests"]
dep_inputs = [
    "scripts/csv_to_yaml.py",
    "scripts/import_audible.py",
]

[analyzer.markdown]

[analyzer.tera]

# .yamllint.yaml already existed but nothing ran it -- same rot as .pylintrc and
# .mypy.ini before they were wired. Both workflow files pass under it as-is.
[processor.yamllint]
src_dirs = [".github"]
dep_inputs = [".yamllint.yaml"]

# src_files rather than src_dirs: a dir-based match walks into
# shared/shared-themes/, whose rsconstruct.toml belongs to the submodule and is
# checked by its own build.
[processor.taplo]
src_files = ["config.toml", "rsconstruct.toml"]

# Catches mojibake and stray encodings. Cheap, needs no config, and this repo is
# bilingual -- the Hebrew content makes an encoding regression a real risk.
# vendor/ excluded: third-party, not ours to police.
[processor.encoding]
src_dirs = ["scripts", "static", "templates", "sass"]
src_exclude_dirs = ["vendor"]

# Correctness rules only (see .stylelintrc.json) -- no formatting opinions, since
# nothing has ever enforced a style here and inventing one would mean rewriting
# all three sheets.
#
# command is the plain global binary, not node_modules/.bin/stylelint. Both
# stylelint and postcss-scss come from [dependencies] npm above, so they land
# in the same global tree and customSyntax resolves. This used to point into
# node_modules on the belief that a global stylelint could not find
# postcss-scss; that is only true when postcss-scss is NOT also installed
# globally. With both listed, no node_modules is needed at all.
[processor.stylelint]
command = "stylelint"
src_dirs = ["sass", "static"]
src_exclude_dirs = ["vendor"]
dep_inputs = [".stylelintrc.json"]

# doc/ and the root .md files only -- deliberately NOT content/.
#
# content/ is published, and markdown linting it is unsafe here: `rumdl fmt`
# rewrote a code span in the debian post (<code>dpkg --purge </code> lost its
# trailing space) and collapsed whitespace inside a JS string literal on the
# chess page, both of which change what the site renders. Verified by diffing
# the built HTML before and after. The posts also carry deliberate WordPress-era
# damage (see CLAUDE.md) that a formatter would happily "fix".
#
# doc/, README.md and CLAUDE.md are not published, so linting them is free.
[processor.rumdl]
src_dirs = ["doc"]
src_files = ["README.md", "CLAUDE.md"]
dep_inputs = [".rumdl.toml"]

# src_files, not src_dirs: a dir sweep pulls in package-lock.json (generated,
# 300KB) and the submodule's own .stylelintrc.json. .htmllintrc is deliberately
# absent -- it is JSONC, with "// npm modules to load" comments, so a strict
# JSON parser rejects it by design.
[processor.ijsonlint]
src_files = ["package.json", ".stylelintrc.json"]
src_exclude_dirs = ["shared", "node_modules", "_site"]
src_exclude_files = ["package-lock.json"]

[processor.duplicate_files]
src_dirs = ["static/images"]
src_extensions = [".jpg", ".jpeg", ".png", ".gif", ".webp"]

# favicon.svg is hand-written and linked from every page, so a malformed one
# breaks the tab icon site-wide and silently. vendor/ is excluded: the
# cm-chessboard piece sets are third-party. The generated sitemap.xml and
# atom.xml are not covered -- they are build output, not sources.
[processor.xmllint]
src_dirs = ["static"]
src_exclude_dirs = ["vendor"]

# Spellchecking runs on aspell, NOT zspell -- deliberately, and not for taste.
#
# zspell cannot load he_IL at all on a 30GB machine. The Hebrew hunspell
# dictionary is 469,509 stems against 3,335 PFX rules (English: 79,013 stems,
# 14 PFX rules -- 6x the stems, 238x the prefix rules). zspell expands that
# affix table eagerly at load rather than applying prefixes at lookup, so the
# cross product is on the order of 1e9 strings. It reached 18GB resident and
# kept climbing. Narrowing the file set and forcing max_jobs = 1 did not help,
# because a single instance is the entire cost -- this is not a parallelism bug.
# English alone would have been fine on zspell; both languages use aspell so
# there is one mechanism to understand rather than two.
#
# aspell streams the whole corpus in ~17MB peak, well under a second.
#
# Each language is a generator (compile the allowlist) plus a checker (run it).
# Both stages are wrapped in scripts rather than invoked directly here, because
# every aspell path option resolves relative names against /usr/lib/aspell
# instead of the working directory. The paths have to be absolute, and an
# absolute path in this file would not survive another machine or CI.
#
# .aspell.he.txt (774 words) and .aspell.en.txt (977) are the committed
# allowlists: transliterated proper nouns, scholarly and technical terms, and
# tokenization fragments. Both are compiled to binary .rws files under out/
# (gitignored) because neither can be passed to aspell as a --personal
# wordlist -- Hebrew plus any non-ASCII entry there is a hard segfault, and for
# English aspell reads that file as Latin-1 whatever --encoding says. See the
# scripts for the full set of traps.
[processor.generator.aspell_he_dict]
command = "scripts/build_he_dict.sh"
src_files = [".aspell.he.txt"]
output_dir = "out/aspell"
output_extension = "rws"

[processor.script.spellcheck_he]
command = "scripts/spellcheck_he.sh"
src_dirs = ["content/blog"]
src_extensions = [".he.md"]
dep_auto = [".aspell.he.txt"]

[processor.generator.aspell_en_dict]
command = "scripts/build_en_dict.sh"
src_files = [".aspell.en.txt"]
output_dir = "out/aspell"
output_extension = "rws"

# Both languages now carry an explicit suffix, so each checker selects exactly
# its own files. Before the .en.md rename this processor had to take every .md
# and drop the Hebrew ones in the script, which made `rsconstruct status`
# report 162 files for a check that only covered 81.
#
# content/blog only, not content/: the standalone app pages (chess, media,
# calendar, ...) are markdown wrappers around <script> blocks, so a spellchecker
# sees addEventListener and btnNextGame rather than prose. .rumdl.toml skips
# them for the same reason.
[processor.script.spellcheck_en]
command = "scripts/spellcheck_en.sh"
src_dirs = ["content/blog"]
src_extensions = [".en.md"]
dep_auto = [".aspell.en.txt"]
