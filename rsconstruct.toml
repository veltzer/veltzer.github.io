[dependencies]
system = ["libxml2-utils", "aspell", "aspell-en", "aspell-he"]
# rssite renders the site (crates.io, cargo install).
cargo = ["rssite"]

[processor.checker.oxlint]
src_dirs = ["static"]
src_exclude_dirs = ["vendor"]
args = ["-c", ".oxlintrc.json"]
[processor.checker.itidy]
src_dirs = ["static"]
# rssite renders the site: `rssite plan` lists every file a build writes with
# the sources each depends on, and rsconstruct makes each one a product, so an
# edited post rebuilds only the files that list it and other processors can
# write into _site/ beside rssite's files. The steps rssite cannot do are
# scripts/build_site.py subcommands, each declaring what it reads and writes.
[processor.mass_generator.generic.site]
command = "rssite"
args = ["build"]
predict_command = "rssite"
predict_args = ["plan"]
output_dirs = ["_site"]

# The commit every page's footer names. templates/base.html loads it with
# load_data, which makes it a source of every rendered page, so rssite runs
# after it and a new commit rebuilds the site. .git/HEAD and .git/index change with every commit (and every
# `git add`); a dirty working tree that nothing staged is not seen.
[processor.explicit.generic.build_info]
command = "scripts/build_site.py"
args = ["build-info"]
inputs = [".git/HEAD", ".git/index"]
output_files = ["out/build_info.toml"]


# The companies tab: organizations.yaml becomes _site/data/companies.json.gz,
# and data/logos/ is copied to _site/logos/. The importer checks every map
# image the YAML names exists under static/images/.
[processor.explicit.generic.companies]
command = "scripts/build_site.py"
args = ["companies"]
inputs = ["data/yaml/organizations.yaml", "scripts/import_companies.py"]
input_globs = ["data/logos/*.svg", "static/images/map-*.jpg"]
output_files = ["_site/data/companies.json.gz"]
output_dirs = ["_site/logos"]

# The English feed served at /atom.xml too (see copy_root_feed). Its input is
# rssite's output, so it runs after rssite.
[processor.explicit.generic.root_feed]
command = "scripts/build_site.py"
args = ["root-feed"]
inputs = ["_site/en/atom.xml"]
output_files = ["_site/atom.xml"]

# Redirect stubs for retired URLs. A mass generator: `--plan` lists every stub
# (the LEGACY_REDIRECTS map plus one per English blog page), so each is its own
# product. The scan fields are what the plan is computed from; while none of
# them changes, the plan is reused.
[processor.mass_generator.generic.redirects]
command = "scripts/build_site.py"
args = ["redirects"]
predict_command = "scripts/build_site.py"
predict_args = ["redirects", "--plan"]
output_dirs = ["_site"]
src_dirs = ["content/blog"]
src_extensions = [".md"]
src_files = ["scripts/build_site.py", "rssite.toml"]

# The blog statistics are generated into committed files (the blog _index
# pages and i18n/tags.toml). The build checks they are current;
# running scripts/gen_stats.py regenerates them.
[processor.checker.script.gen_stats]
command = "scripts/gen_stats.py"
args = ["--check"]
fix_command = "scripts/gen_stats.py"
src_files = ["content/blog/_index.en.md"]
dep_inputs = ["content/blog/*.md", "i18n/tags.toml"]

[processor.checker.ruff]
src_dirs = ["scripts", "tests"]
[processor.checker.pyrefly]
src_dirs = ["scripts", "tests"]
[processor.checker.pytest]
src_dirs = ["tests"]
# Everything the tests import or read, so an edit to any of it re-runs the
# suite on a warm cache.
dep_inputs = [
    "scripts/build_site.py",
    "scripts/csv_to_yaml.py",
    "scripts/gen_stats.py",
    "scripts/import_audible.py",
    "scripts/import_books.py",
    "scripts/import_companies.py",
]
[analyzer.markdown]

[analyzer.tera]
# ─── data ────────────────────────────────────────────────────────────────────
# data/yaml is the source of truth for the media tracker and the profile block
# (it used to live in the private ../data repo). The four checks it had there
# came with it: lint, schema validation ($schema in each file), a JSON
# conversion that proves every file parses, and pydatacheck's cross-checks
# against imdb / goodreads / simania, which read their caches from shelve/.
[processor.checker.iyamllint]
src_dirs = [".github", "data/yaml"]

[processor.checker.iyamlschema]
src_dirs = ["data/yaml"]

[processor.generator.yaml2json]
src_dirs = ["data/yaml"]

[processor.checker.script.check_videos]
src_files = ["data/yaml/video_series.yaml", "data/yaml/video_features.yaml"]
command = "pydatacheck"
args = ["check_videos"]
batch = true

[processor.checker.script.check_books]
src_files = ["data/yaml/books_read.yaml"]
command = "pydatacheck"
args = ["check_books"]
[processor.checker.taplo]
src_files = ["rssite.toml", "rsconstruct.toml", ".rumdl.toml", ".rumdl.content.toml", "pyproject.toml", "static/identity.toml", "i18n/en.toml", "i18n/he.toml", "i18n/tags.toml"]

[processor.checker.encoding]
src_dirs = ["scripts", "static", "templates", "sass", "i18n"]
src_exclude_dirs = ["vendor"]
# sass/style.scss is compiled with rsconstruct's native (Rust) sass compiler
# and the resulting CSS is linted with biome: biome reads CSS, not SCSS. Zola
# still compiles the site's own copy at publish time; this one only exists to
# be linted.
[processor.generator.isass]
src_dirs = ["sass"]
# Only .css is passed: biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.checker.biome]
src_dirs = ["out/processor.generator.isass"]
src_extensions = [".css"]
# not linted: static/vendor (vendored cm-chessboard and chess.js)
# content/{animations,slides,syllabi}/_index.en.md are generated by
# scripts/import_teaching.py from the built teaching-* sites: they inline
# each upstream page's <style>, and rumdl reads those CSS selectors as
# headings. They are build output, not authored markdown.
[processor.checker.rumdl.prose]
src_dirs = ["doc"]
src_files = ["README.md", "CLAUDE.md"]
src_exclude_dirs = ["content"]

# content/ is Zola pages: the H1 comes from the frontmatter title via
# templates/page.html, so they are linted with the content config.
# The three imported app pages are generated by scripts/import_teaching.py
# and inline the upstream sites' <style>, which rumdl reads as headings.
[processor.checker.rumdl.content]
src_dirs = ["content"]
args = ["--config", ".rumdl.content.toml"]
dep_inputs = [".rumdl.content.toml"]
src_exclude_paths = [
	"content/animations/_index.en.md",
	"content/slides/_index.en.md",
	"content/syllabi/_index.en.md",
]

[processor.checker.duplicate_files]
src_dirs = ["static/images"]
src_extensions = [".jpg", ".jpeg", ".png", ".gif", ".webp"]
# data/logos/*.svg are the organization logos organizations.yaml points at
# (paths in that file are relative to data/): well-formed XML via ixmllint.
# The bitmaps they were traced from are in data/raw/logos/ and are not
# checked.
[processor.checker.ixmllint]
src_dirs = ["static", "data/logos"]
src_exclude_dirs = ["vendor"]
[processor.generator.generic.aspell_he_dict]
command = "scripts/build_he_dict.sh"
src_files = [".aspell.he.txt"]
output_dir = "out/aspell"
output_extension = "rws"
[processor.checker.script.spellcheck_he]
command = "scripts/spellcheck_he.sh"
src_dirs = ["content/blog"]
src_extensions = [".he.md"]
dep_auto = [".aspell.he.txt"]
[processor.generator.generic.aspell_en_dict]
command = "scripts/build_en_dict.sh"
src_files = [".aspell.en.txt"]
output_dir = "out/aspell"
output_extension = "rws"
[processor.checker.script.spellcheck_en]
command = "scripts/spellcheck_en.sh"
src_dirs = ["content/blog"]
src_extensions = [".en.md"]
dep_auto = [".aspell.en.txt"]

[pages]
dir = "_site"

[build]
parallel = 0

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.ishellcheck]
src_dirs = ["scripts"]
