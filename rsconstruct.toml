[dependencies]
# libfribidi0 and fonts-liberation: the post share cards (make_post_cards.py)
# lay Hebrew out right to left through Pillow, whose wheel loads fribidi from
# the system, and set it in Liberation Sans.
system = ["libxml2-utils", "aspell", "aspell-en", "aspell-he", "libfribidi0", "fonts-liberation"]
# rssite renders the site (crates.io, cargo install).
cargo = ["rssite"]

[processor.checker.oxlint]
src_dirs = ["static"]
src_exclude_dirs = ["vendor"]
args = ["-c", ".oxlintrc.json"]
# The rendered pages, checked the way `tidy -errors` does (in-process): a
# stray or unclosed tag, an unknown element, a <style> in the body. It does
# not know HTML5's content rules (a <main> nested in a <main> passes); the
# vnu check below does.
# The options silence what is correct here and tidy 5.8 does not know:
# Hebrew tag URLs are valid IRIs (fix-uri), data-* and loading/decoding
# attributes are HTML5 (warn-proprietary-attributes), the imported teaching
# pages use custom elements (custom-tags), and an empty element is a
# placeholder a script fills (drop-empty-elements). fix-style-tags: no makes
# a <style> in the body a warning instead of a silent move.
[processor.checker.itidy]
src_dirs = ["_site"]
src_exclude_dirs = ["vendor"]
# The three imported app pages (scripts/import_teaching.py) inline the
# upstream sites' <style> in the body, by design; nothing here authors them.
src_exclude_paths = [
    "_site/en/animations/index.html",
    "_site/en/slides/index.html",
    "_site/en/syllabi/index.html",
    "_site/he/animations/index.html",
    "_site/he/slides/index.html",
    "_site/he/syllabi/index.html",
]
options = [
    "fix-uri: no",
    "warn-proprietary-attributes: no",
    "custom-tags: blocklevel",
    "fix-style-tags: no",
    "drop-empty-elements: no",
]
# The rendered pages again, against the HTML standard itself: the Nu Html
# Checker (the validator behind validator.w3.org) knows the content model,
# so it catches what tidy cannot, a <main> inside a <main> for one. Errors
# only: its warnings include advice (a section without a heading) and the
# empty headings a script fills in. It is a jar run with java; the jar is
# pinned in rsconstruct.lock. The same six imported pages are left out.
[processor.checker.vnu]
src_dirs = ["_site"]
src_exclude_dirs = ["vendor"]
src_exclude_paths = [
    "_site/en/animations/index.html",
    "_site/en/slides/index.html",
    "_site/en/syllabi/index.html",
    "_site/he/animations/index.html",
    "_site/he/slides/index.html",
    "_site/he/syllabi/index.html",
]
args = ["--errors-only"]
# rssite renders the site: `rssite plan` lists every file a build writes with
# the sources each depends on, and rsconstruct makes each one a product, so an
# edited post rebuilds only the files that list it and other processors can
# write into _site/ beside rssite's files. rssite also writes the feeds, the
# sitemap and the archive stats, and reads
# the commit for the footer itself (its git files are page sources). The one
# step it cannot do is the companies data, a scripts/build_site.py
# subcommand declaring what it reads and writes.
[processor.mass_generator.generic.site]
command = "rssite"
args = ["build"]
predict_command = "rssite"
predict_args = ["plan"]
output_dirs = ["_site"]

# The organization tabs: organizations.yaml becomes _site/data/companies.json.gz
# (taught at), training_providers.json.gz (taught for) and consulting.json.gz
# (consulted for), publishers.json.gz (the media page's publishers),
# education.json.gz (studied at), certifiers.json.gz (certified by), and
# certifications.yaml joined with the
# issuers becomes certifications.json.gz (one entry per certification), and
# data/logos/ is copied to _site/logos/. The importer checks every map
# image the YAML names exists under static/images/.
[processor.explicit.generic.companies]
command = "scripts/build_site.py"
args = ["companies"]
inputs = ["data/yaml/organizations.yaml", "data/yaml/certifications.yaml", "scripts/build_site.py", "scripts/import_companies.py", "scripts/import_certifications.py"]
input_globs = ["data/logos/*.svg", "static/images/map-*.jpg"]
output_files = ["_site/data/companies.json.gz", "_site/data/training_providers.json.gz", "_site/data/consulting.json.gz", "_site/data/publishers.json.gz", "_site/data/education.json.gz", "_site/data/certifiers.json.gz", "_site/data/certifications.json.gz"]
output_dirs = ["_site/logos"]

# A share card (og:image) per blog post: content/blog/foo.en.md becomes
# _site/images/og/foo.en.jpg, which templates/base.html names. Build output,
# not committed, so a card is redrawn whenever its post changes. The site-wide
# cards beside them (static/images/og/card-*.jpg) are drawn by hand by
# make_og_images.py, whose layout constants these share.
[processor.generator.generic.post_cards]
command = "scripts/make_post_cards.py"
src_dirs = ["content/blog"]
src_extensions = [".md"]
# src_exclude_paths, not src_exclude_files: the latter takes bare file names,
# so with paths it excluded nothing and the two index files got cards.
src_exclude_paths = ["content/blog/_index.en.md", "content/blog/_index.he.md"]
output_dir = "_site/images/og"
output_extension = "jpg"
# The two Outfit files are the fonts the cards are set in (make_og_images.py).
dep_inputs = [
    "scripts/make_og_images.py",
    "scripts/make_logo.py",
    "i18n/en.toml",
    "i18n/he.toml",
    "shared/shared-themes/fonts/Outfit-Bold.ttf",
    "shared/shared-themes/fonts/Outfit-Light.ttf",
]

[processor.checker.ruff]
src_dirs = ["scripts", "tests"]
[processor.checker.pyrefly]
src_dirs = ["scripts", "tests"]
[processor.checker.pytest]
src_dirs = ["tests"]
# Everything the tests import or read, so an edit to any of it re-runs the
# suite on a warm cache.
dep_inputs = [
    "scripts/csv_to_yaml.py",
    "scripts/import_audible.py",
    "scripts/import_books.py",
    "scripts/import_certifications.py",
    "scripts/import_companies.py",
    "scripts/import_teaching.py",
    "scripts/make_word_vectors.py",
    "scripts/check_hebrew.py",
    "scripts/podcast_utils.py",
    "scripts/podcasts_backfill_rss_data.py",
    # test_logo.py compares make_logo.py with the two committed copies of the logo.
    "scripts/make_logo.py",
    "templates/base.html",
    "static/favicon.svg",
    # test_people.py reads every data file's with: names.
    "data/yaml/audible.yaml",
    "data/yaml/audio_books.yaml",
    "data/yaml/audio_courses.yaml",
    "data/yaml/books_loans.yaml",
    "data/yaml/books_read.yaml",
    "data/yaml/certifications.yaml",
    "data/yaml/concerts.yaml",
    "data/yaml/courses.yaml",
    "data/yaml/cv.yaml",
    "data/yaml/lectures.yaml",
    "data/yaml/loans.yaml",
    "data/yaml/museums.yaml",
    "data/yaml/organizations.yaml",
    "data/yaml/people.yaml",
    "data/yaml/podcasts.yaml",
    "data/yaml/political_rallies.yaml",
    "data/yaml/profiles.yaml",
    "data/yaml/study_sites.yaml",
    "data/yaml/text_articles.yaml",
    "data/yaml/text_books.yaml",
    "data/yaml/trips.yaml",
    "data/yaml/video_courses.yaml",
    "data/yaml/video_features.yaml",
    "data/yaml/video_series.yaml",
    "data/yaml/video_youtube.yaml",
]
[analyzer.markdown]

[analyzer.tera]
# ─── data ────────────────────────────────────────────────────────────────────
# data/yaml is the source of truth for the media tracker and the profile block
# (it used to live in the private ../data repo). The four checks it had there
# came with it: lint, schema validation ($schema in each file), a JSON
# conversion that proves every file parses, and pydatacheck's cross-checks
# against imdb / goodreads / simania, which read their caches from shelve/.
[processor.checker.iyamllint]
src_dirs = [".github", "data/yaml"]

[processor.checker.iyamlschema]
src_dirs = ["data/yaml"]

[processor.generator.yaml2json]
src_dirs = ["data/yaml"]

[processor.checker.script.check_videos]
src_files = ["data/yaml/video_series.yaml", "data/yaml/video_features.yaml"]
command = "pydatacheck"
args = ["check_videos"]
batch = true

# Each wikidata_id in the video yaml must be the Wikidata item whose IMDb id
# (P345) is the entry's imdb_id, and every entry's rotten_tomatoes_id the
# Rotten Tomatoes path (P1258) on that item, as recorded in
# shelve/wikidata_imdb.json by scripts/videos_fetch_wikidata.py, or, when
# Wikidata has none, the hand-verified one in data/rotten_tomatoes_manual.json.
# The check reads only those two files.
[processor.checker.script.wikidata_ids]
src_files = ["data/yaml/video_series.yaml", "data/yaml/video_features.yaml"]
command = "scripts/check_wikidata_ids.py"
batch = true
dep_inputs = ["shelve/wikidata_imdb.json", "data/rotten_tomatoes_manual.json", "scripts/check_wikidata_ids.py"]

# Every media item has its card image in static/images/: a series added to the
# YAML without running its fetch_*.py used to ship with a broken card (eight
# series in 2026-11 did) because this check was manual. An explicit step rather
# than a script checker: a checker caches per file, so a deleted image just
# drops out of its list, while here the matched glob is one input set and
# adding, deleting or changing an image reruns the check. It writes an empty
# stamp file on success, the output the step needs.
[processor.explicit.generic.check_images]
command = "scripts/check_images.py"
inputs = [
    "scripts/check_images.py",
    "scripts/import_books.py",
    "data/yaml/audible.yaml",
    "data/yaml/audio_courses.yaml",
    "data/yaml/books_read.yaml",
    "data/yaml/concerts.yaml",
    "data/yaml/museums.yaml",
    "data/yaml/podcasts.yaml",
    "data/yaml/video_features.yaml",
    "data/yaml/video_series.yaml",
]
input_globs = ["static/images/*.jpg"]
output_files = ["out/check_images/ok"]

# Mirror every post to ~/insync/for_ai/blog, which Insync syncs to Google
# Drive for AI agents that read it. Runs only on a machine with that folder
# (enabled_if_dir_exists): on CI and other clones it is skipped and the build
# says so. The stamp marks the last successful mirror; the script and the
# posts are inputs, so it reruns when either changes, a post is deleted
# included. Known gap: posts that return to a state built before (an edit
# reverted) match the old cache entry and do not rerun it; run the script by
# hand then.
[processor.explicit.generic.export_posts_for_ai]
command = "scripts/export_posts_for_ai.py"
args = ["--dest", "~/insync/for_ai/blog"]
enabled_if_dir_exists = "~/insync/for_ai/blog"
inputs = ["scripts/export_posts_for_ai.py"]
input_globs = ["content/blog/*.md"]
output_files = ["out/export_posts_for_ai/ok"]

[processor.checker.script.check_books]
src_files = ["data/yaml/books_read.yaml"]
command = "pydatacheck"
args = ["check_books"]
[processor.checker.taplo]
src_files = ["rssite.toml", "rsconstruct.toml", ".rumdl.toml", ".rumdl.content.toml", "pyproject.toml", "data/identity.toml", "i18n/en.toml", "i18n/he.toml"]

# The committed JSON: the lookup caches the data checks read and the search's
# word lists. static/vendor is not ours, and .oxlintrc.json is JSON with
# comments, which oxlint itself parses on every run.
[processor.checker.ijsonlint]
src_dirs = ["data", "shelve", "static"]
src_exclude_dirs = ["vendor"]

[processor.checker.encoding]
src_dirs = ["scripts", "static", "templates", "sass", "i18n"]
src_exclude_dirs = ["vendor"]
# sass/style.scss is compiled with rsconstruct's native (Rust) sass compiler
# and the resulting CSS is linted with biome: biome reads CSS, not SCSS. rssite
# compiles the site's own copy when it builds the site; this one only exists
# to be linted.
[processor.generator.isass]
src_dirs = ["sass"]
# Only .css is passed: .biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.checker.biome]
src_dirs = ["out/processor.generator.isass"]
src_extensions = [".css"]
# not linted: static/vendor (vendored cm-chessboard, chess.js, FullCalendar,
# and the compiled media Tailwind CSS)
# content/{animations,slides,syllabi}/_index.en.md are generated by
# scripts/import_teaching.py from the built teaching-* sites: they inline
# each upstream page's <style>, and rumdl reads those CSS selectors as
# headings. They are build output, not authored markdown.
[processor.checker.rumdl.prose]
src_dirs = ["doc"]
src_files = ["README.md", "CLAUDE.md", "TOFIX.md"]

# content/ is rssite pages: the H1 comes from the frontmatter title via
# templates/page.html, so they are linted with the content config.
# The three imported app pages are generated by scripts/import_teaching.py
# and inline the upstream sites' <style>, which rumdl reads as headings.
[processor.checker.rumdl.content]
src_dirs = ["content"]
args = ["--config", ".rumdl.content.toml"]
dep_inputs = [".rumdl.content.toml"]
src_exclude_paths = [
	"content/animations/_index.en.md",
	"content/slides/_index.en.md",
	"content/syllabi/_index.en.md",
]

[processor.checker.duplicate_files]
src_dirs = ["static/images"]
src_extensions = [".jpg", ".jpeg", ".png", ".gif", ".webp"]
# data/logos/*.svg are the organization logos organizations.yaml points at
# (paths in that file are relative to data/): well-formed XML via ixmllint.
[processor.checker.ixmllint]
src_dirs = ["static", "data/logos"]
src_exclude_dirs = ["vendor"]
# Every post is <date>-<slug>.<lang>.md with a short `slug` (at most four
# words) in its front matter; see the script and CLAUDE.md, "Blog Posts".
[processor.checker.script.post_names]
command = "scripts/check_post_names.py"
src_dirs = ["content/blog"]
src_extensions = [".md"]
src_exclude_paths = ["content/blog/_index.en.md", "content/blog/_index.he.md"]
batch = true
# What a Hebrew reader is handed outside the pages is Hebrew: the feeds and
# the share cards. Three instances of one script (see it for the rules): the
# Hebrew posts' title, description and tags, which are the text of a post's
# card and feed entry; the name on the cards, from i18n/he.toml; and the
# built Hebrew feeds, where the generator or its configuration could slip an
# English string in (tag feeds carried the English site title and every
# entry an English author name until 2026-11-19).
[processor.checker.script.hebrew_posts]
command = "scripts/check_hebrew.py"
src_dirs = ["content/blog"]
src_extensions = [".he.md"]
src_exclude_paths = ["content/blog/_index.he.md"]
batch = true
[processor.checker.script.hebrew_strings]
command = "scripts/check_hebrew.py"
src_files = ["i18n/he.toml"]
[processor.checker.script.hebrew_feeds]
command = "scripts/check_hebrew.py"
src_dirs = ["_site/he"]
src_extensions = [".xml"]
batch = true
[processor.generator.generic.aspell_he_dict]
command = "scripts/build_he_dict.sh"
src_files = [".aspell.he.txt"]
output_dir = "out/aspell"
output_extension = "rws"
[processor.checker.script.spellcheck_he]
command = "scripts/spellcheck_he.sh"
src_dirs = ["content/blog"]
src_extensions = [".he.md"]
dep_auto = [".aspell.he.txt"]
[processor.generator.generic.aspell_en_dict]
command = "scripts/build_en_dict.sh"
src_files = [".aspell.en.txt"]
output_dir = "out/aspell"
output_extension = "rws"
[processor.checker.script.spellcheck_en]
command = "scripts/spellcheck_en.sh"
src_dirs = ["content/blog"]
src_extensions = [".en.md"]
dep_auto = [".aspell.en.txt"]

[pages]
dir = "_site"

[build]
parallel = 0

# The schemas data/yaml validates against are fetched from
# veltzer.github.io/web-schemas and kept in the web cache, which CI restores
# with the rest of .rsconstruct. At the 7-day default a schema change was not
# seen for a week unless the cache was cleared by hand; an hour covers the usual
# push-the-schema-then-the-data sequence and still saves the refetch per build.
[cache]
webcache_ttl_secs = 3600

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.ishellcheck]
src_dirs = ["scripts"]
