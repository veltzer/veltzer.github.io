[dependencies]
pip = [
  "mkdocs-material",
  "mkdocs-glightbox",
  "mkdocs-rss-plugin",
]

[processor.eslint]
src_dirs = ["blog"]
args = ["-c", "config/eslint.config.js"]

[processor.tidy]
src_dirs = ["blog"]

[processor.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
]

[processor.explicit]
command = "scripts/build_docs.py"
inputs = [
    "mkdocs.yml",
]
input_globs = [
    "blog/**/*",
]
output_dirs = [ "_site" ]

[processor.shellcheck]
src_dirs = ["scripts"]

# .pylintrc and .mypy.ini already existed but nothing ran them. Both pass clean,
# so wiring them in keeps that true rather than letting it rot.
[processor.pylint]
src_dirs = ["scripts"]
args = ["--rcfile=.pylintrc"]

# dep_auto defaults to "mypy.ini"; this project's file is ".mypy.ini", so the
# config has to be passed explicitly and declared as a dependency by hand.
[processor.mypy]
src_dirs = ["scripts"]
args = ["--config-file=.mypy.ini"]
dep_inputs = [".mypy.ini"]

[analyzer.markdown]

[analyzer.tera]
