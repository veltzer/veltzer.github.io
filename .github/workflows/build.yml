name: build
on: push
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/cache@v5
      with:
        path: .rsconstruct
        key: rsconstruct-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          rsconstruct-${{ runner.os }}-
    - name: install rsconstruct
      run: |
        gh release download --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
        chmod +x /usr/local/bin/rsconstruct
        rsconstruct version
      env:
        GH_TOKEN: ${{ github.token }}
    - name: install
      run: |
        rsconstruct tools install-deps
        rsconstruct tools install
    - name: build
      run: rsconstruct build --verbose -j0
    - name: status
      run: rsconstruct status
    - uses: actions/upload-pages-artifact@v5
    - uses: actions/deploy-pages@v5
