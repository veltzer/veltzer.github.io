name: build
on: push

permissions:
  pages: write
  id-token: write

# Cancel a run as soon as a newer one starts, rather than letting both queue.
#
# GitHub Pages serialises deployments, so without this a second push while the
# first is still building leaves the older run parked waiting for the Pages
# environment -- one was observed sitting in_progress for over an hour before
# being cancelled by hand. The older build is worthless the moment a newer
# commit exists, so cancelling it is strictly better than waiting for it.
#
# `group: pages` rather than the workflow+ref form used in the python repos:
# what actually queues is the Pages deployment, not the workflow, and this
# matches the rs* repos that deploy the same way (rscalendar, rsconstruct,
# rstype and the rest). Only master ever deploys here, so keying on the branch
# would buy nothing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
    - uses: actions/checkout@v6
      with:
        # shared-themes provides the design tokens; the build fails without it.
        submodules: recursive
    # python-version is pinned rather than left to whatever the runner image
    # ships. Unpinned, setup-python warns and falls back to the Python already
    # on PATH -- which also leaves its pip cache empty, since there is no
    # resolved version to key the cache on. 3.12 is what ubuntu-24.04 provided
    # and what this project has been passing CI on; bump it deliberately, not by
    # runner-image drift. (.pylintrc targets 3.10, so the code itself is not
    # tied to 3.12.)
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        # There is no requirements.txt or pyproject.toml here -- the pip list
        # lives in rsconstruct.toml's [dependencies] -- and without this the
        # cache step hard-fails looking for one. rsconstruct.toml is also the
        # correct cache key: it changes exactly when the dependencies do.
        #
        # This only surfaced once python-version was pinned. Before that the
        # cache silently did nothing, because there was no resolved version to
        # key it on.
        cache-dependency-path: rsconstruct.toml
    - uses: actions/setup-node@v6
      with:
        cache: npm
    - uses: actions/cache@v5
      with:
        path: .rsconstruct
        key: rsconstruct
    - name: install rsconstruct
      run: |
        gh release download --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
        chmod +x /usr/local/bin/rsconstruct
        rsconstruct version
      env:
        GH_TOKEN: ${{ github.token }}
    # Zola builds the site. Pinned rather than tracking latest: 0.23 renamed
    # config keys (highlight_code -> [markdown.highlighting]) and swapped the
    # highlighter, so an unpinned upgrade can fail the build on config alone.
    - name: install zola
      run: |
        gh release download "$ZOLA_VERSION" --repo getzola/zola \
          --pattern '*x86_64-unknown-linux-gnu.tar.gz' --output /tmp/zola.tar.gz
        tar xzf /tmp/zola.tar.gz -C /usr/local/bin zola
        chmod +x /usr/local/bin/zola
        zola --version
      env:
        GH_TOKEN: ${{ github.token }}
        ZOLA_VERSION: v0.23.3
    # rsconstruct installs global npm tools (eslint, htmlhint), but stylelint is
    # a devDependency here rather than a global: a globally-installed stylelint
    # resolves customSyntax against its own tree and cannot find postcss-scss,
    # so rsconstruct.toml invokes node_modules/.bin/stylelint. That path only
    # exists once the project's own packages are installed -- setup-node's
    # "cache: npm" primes the download cache but never runs an install.
    - name: install npm packages
      run: npm ci
    # The aspell dictionaries, installed here rather than left to
    # `rsconstruct tools install-deps`. That command checks whether each system
    # package is already present before asking apt, and the check misfires on
    # packages that ship no binary of their own: it reported "aspell-en" as
    # satisfied on a runner that had neither aspell nor aspell-en, so apt was
    # never asked for it. `aspell create master` then failed with a bare
    # non-zero exit, because the language data (/usr/lib/aspell/en.dat) lives in
    # aspell-en. Hebrew survived only because aspell-he does get installed and
    # drags aspell in as a dependency.
    #
    # apt-get update first: the runner image ships stale package lists, and the
    # only update in this job happens later, inside install-deps.
    #
    # The timeouts and retries are what make this step reliable. The runner's
    # /etc/apt/apt-mirrors.txt lists azure.archive.ubuntu.com first, and that
    # host goes unreachable intermittently -- on 2026-08-19 a run 15 minutes
    # after a green one got nothing but "Ign:" from it. apt's own defaults turn
    # that into a hang rather than an error: Acquire::Retries is 0, so there is
    # no second attempt, and the http timeout is 120s per connection, which the
    # mirrorlist then multiplies across every suite and component. One run sat
    # for over half an hour before being cancelled by hand; another blew a
    # 5-minute step timeout with 4.5 of those minutes spent silent.
    #
    # Timeout=15 caps how long a dead mirror can hold each connection, and
    # Retries=3 lets apt fall through to archive.ubuntu.com, which stayed
    # healthy throughout. timeout-minutes stays as the outer backstop for
    # anything these do not cover.
    #
    # This does not weaken the check: aspell is still required and the build
    # still fails without it. It only stops a flaky mirror from being reported
    # as a broken build.
    - name: install aspell dictionaries
      timeout-minutes: 5
      env:
        APT_OPTS: >-
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
      run: |
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y aspell aspell-en aspell-he
    - name: install
      run: |
        rsconstruct tools install-deps
        rsconstruct tools install
    - name: build
      run: rsconstruct build --verbose -j0
    - name: status
      run: rsconstruct status
    # v5, not v3: v3 pulls in actions/upload-artifact@v4, which targets the
    # deprecated Node 20 and is being force-run on Node 24. v5 uses
    # upload-artifact@v7 and drops the deprecation warning.
    - uses: actions/upload-pages-artifact@v5
    - uses: actions/deploy-pages@v5
