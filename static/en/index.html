<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Zola serves the default language (English) at the site root, and only
     prefixes non-default languages -- so /he/ exists but /en/ never did.
     That asymmetry is Zola's design and is not configurable, but /en/ is a
     reasonable guess for a reader who has seen /he/, so redirect rather than
     404. -->
<title>Redirecting…</title>
<link rel="canonical" href="https://veltzer.org/">
<meta http-equiv="refresh" content="0; url=/">
</head>
<body>
<p>The English site lives at <a href="/">veltzer.org</a>. Redirecting…</p>
</body>
</html>
