     generated.

     It also bypassed templates/base.html, so it missed whatever the templates
     add -- the analytics snippet is what surfaced that. -->
<title>Redirecting…</title>

<meta http-equiv="refresh" content="0; url=/">
<meta name="robots" content="noindex, follow">
</head>
