<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <title>Chess Viewer — Mark Veltzer</title>
    <meta name="description" content="Interactive chess game viewer — step through the famous Opera Game (1858) by Paul Morphy.">
    <meta property="og:title" content="Chess Viewer — Mark Veltzer">
    <meta property="og:description" content="Interactive chess game viewer — step through the famous Opera Game (1858) by Paul Morphy.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://veltzer.org/chess.html">
    
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- cm-chessboard and chess.js are vendored under vendor/ rather than loaded
         from a CDN: unpkg removed cm-chessboard@8.6.0, which left this page
         throwing "Chessboard is not defined" and rendering no board at all.
         Vendoring makes the page independent of a third party's retention. -->
    <link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css"/>
    <script src="vendor/chess.min.js"></script>

    <link rel="stylesheet" href="shared.css">
</head>
<body class="bg-gray-800 text-white flex items-center justify-center min-h-screen">

    <div class="text-center p-4">
        <!-- This page does not share the site header (it is a standalone app page
             under static/, not a content/ section), so it needs its own way back. -->
        <p class="mb-4 text-left"><a href="/" class="text-blue-400 hover:underline">&larr; Back to the site</a></p>
        <h1 class="text-3xl font-bold mb-4">Opera Game (1858)</h1>
        <p class="mb-4 text-gray-400">Paul Morphy vs. Duke Karl / Count Isouard</p>
        
        <!-- The chessboard will be rendered here -->
        <div id="gameBoard" class="w-full max-w-lg mx-auto mb-4"></div>
        
        <!-- Navigation controls -->
        <div class="space-x-4">
            <button id="btnPrev" class="nav-btn bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg" aria-label="Go to previous move">Previous</button>
            <button id="btnNext" class="nav-btn bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg" aria-label="Go to next move">Next</button>
        </div>
        
        <!-- Display the current move -->
        <div id="status" class="mt-4 text-lg font-mono"></div>
    </div>

    <script type="module">
        // cm-chessboard 8.x is ESM-only with relative imports, so this has to be
        // a module. Modules are deferred, so DOM is ready without window.onload.
        import {Chessboard, FEN} from "./vendor/cm-chessboard/src/Chessboard.js";

        (function() {
            // --- Global State Variables ---
            let board = null;
            const game = new Chess();
            let moveHistory = [];
            let currentMove = 0;

            // --- Hardcoded PGN for the Opera Game ---
            // The blank line between the header block and the movetext is required
            // by the PGN spec, and chess.js enforces it: without it load_pgn()
            // returns false and the viewer silently shows an empty game.
            const pgn = `
                [Event "A Night at the Opera"]
                [Site "Paris, France"]
                [Date "1858.11.02"]
                [Result "1-0"]
                [White "Paul Morphy"]
                [Black "Duke Karl / Count Isouard"]

                1.e4 e5 2.Nf3 d6 3.d4 Bg4 4.dxe5 Bxf3 5.Qxf3 dxe5 6.Bc4 Nf6 7.Qb3 Qe7
                8.Nc3 c6 9.Bg5 b5 10.Nxb5 cxb5 11.Bxb5+ Nbd7 12.O-O-O Rd8
                13.Rxd7 Rxd7 14.Rd1 Qe6 15.Bxd7+ Nxd7 16.Qb8+ Nxb8 17.Rd8# 1-0
            `;

            // --- DOM Element References ---
            const statusEl = document.getElementById('status');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            // --- Function to update the board and UI ---
            function updateStatus() {
                const move = moveHistory[currentMove - 1] || { san: 'Start' };
                statusEl.textContent = 'Move ' + currentMove + ': ' + move.san;
                
                // Set board to the current position
                const tempGame = new Chess();
                moveHistory.slice(0, currentMove).forEach(m => tempGame.move(m.san));
                
                // Use the setPosition method with a FEN string
                board.setPosition(tempGame.fen(), true);

                // Update button states
                btnPrev.disabled = currentMove === 0;
                btnNext.disabled = currentMove === moveHistory.length;
            }

            // --- Initialize the Game ---
            // The template literal above is indented to match the surrounding
            // code, and chess.js will not parse header lines that start with
            // whitespace -- load_pgn() just returns false and the viewer shows an
            // empty game. Strip the indentation before handing it over.
            const cleanPgn = pgn.split('\n').map(function(line) {
                return line.trim();
            }).join('\n').trim();
            if (!game.load_pgn(cleanPgn)) {
                statusEl.textContent = 'Could not load the game.';
                return;
            }
            moveHistory = game.history({ verbose: true });

            // --- Initialize the Board ---
            // 8.x replaced the old `sprite: {url, size}` option with assetsUrl plus
            // a pieces file relative to it.
            const boardConfig = {
                // 8.x wants a FEN string here; the old "start" shorthand is gone.
                position: FEN.start,
                assetsUrl: "./vendor/cm-chessboard/assets/",
                style: {pieces: {file: "pieces/standard.svg"}}
            };
            board = new Chessboard(document.getElementById('gameBoard'), boardConfig);

            // --- Event Listeners ---
            btnPrev.addEventListener('click', () => {
                if (currentMove > 0) {
                    currentMove--;
                    updateStatus();
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentMove < moveHistory.length) {
                    currentMove++;
                    updateStatus();
                }
            });

            // --- Initial Render ---
            updateStatus();
        }());
    </script>

</body>
</html>
