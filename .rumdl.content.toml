# Markdown lint rules for this site's rssite content (content/). The fleet
# .rumdl.toml still governs README.md and doc/; this file starts from it and
# differs in two rules: MD041 is off here, and MD053 stays on, because no post
# uses the [//]: <> comment idiom the fleet file turns MD053 off for.

# MD057 (existing-relative-links) resolves link targets as files relative to
# the post. Posts link to each other as @/blog/post.md, which rssite resolves
# to a permalink at build time, failing the build when the target does not
# exist; rumdl cannot resolve them and would report every one as broken.
# MD014 (commands-show-output) wants a shell example either to show its
# output or to drop the "$" prompt. A few posts keep the prompt on purpose,
# to set the command apart from its output, as the fleet file explains.
# MD041 (first line should be a level-1 heading) does not fit rssite content
# pages: templates/page.html renders <h1>{{ page.title }}</h1> from the +++
# frontmatter, so the page already has exactly one H1 and a body heading
# would duplicate it. Posts here start with prose and use ## for sections.
[global]
disable = ["MD014", "MD022", "MD024", "MD026", "MD031", "MD032", "MD033", "MD034", "MD041", "MD057"]

[MD007]
indent = 4

[MD013]
line_length = 1000
