# next line is neccessary for vscode which does not read the $schema attribute
# yaml-language-server: $schema=https://veltzer.github.io/web-schemas/json/organizations.json
# Organizations I taught at, consulted for, was certified by, or consumed media from.
# Extracted from the myworld MySQL database (TbOrganization, backup of 2019-05-11);
# status/location/website fields researched on the web on 2026-09-19.
# logos/<slug>.svg (paths relative to data/): genuine vector logos fetched 2026-09-20 where one exists
# (logo_kind/logo_source say which); the rest are colour traces of the original bitmaps in raw/logos/.
# Every logo sits on the same 1000x1000 canvas (content fitted with a 6% margin, centred) on a transparent
# background; the traces have the bitmap's white/black surround keyed out before tracing (2026-09-20).
# <field>_geo blocks (place, lat, lon) are written by scripts/organizations_geocode.py from Nominatim (2026-09-25); place is
# the prose reduced to one city - correct by hand if a point is wrong, a re-run without --force keeps it.
# geo (from, place, lat, lon) is the one point a map should show for the organization, chosen by hand with
# scripts/organizations_pick_geo.py from those blocks; from names the field it was taken from.
# The schema (web-schemas/docs/json/organizations.json) requires geo on every organization, so the build fails
# when one has no map point.
$schema: https://veltzer.github.io/web-schemas/json/organizations.json
