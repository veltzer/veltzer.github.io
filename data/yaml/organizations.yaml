# next line is neccessary for vscode which does not read the $schema attribute
# yaml-language-server: $schema=https://veltzer.github.io/web-schemas/json/organizations.json
# Organizations I studied at.
# The companies that certified me (function certification: ids 17, 41, 100) were removed on 2026-11-23 with
# certifications.yaml: they live in My World (myworld.stream) now, the companies with the relation Certification and
# the certifications themselves on its Certifications page, each with the company that issued it.
# The clients I taught at (function teaching: 90 organizations, every one but the 7 left, ids 17, 41, 84, 89, 100, 125, 126) were removed
# on 2026-11-23: they live in My World (myworld.stream) now, with the relation Teaching. Their logos and the map
# images only they used left with them.
# The training companies I taught for (function training-provider: ids 14, 18, 31, 99, 122-124) were removed on
# 2026-11-23: they live in My World (myworld.stream) now, with the relation Training provider and the type
# Training Company.
# The consulting (function consulting) was removed on 2026-11-22: the companies I consulted for live in My World
# (myworld.stream) now, with the relation Consulting. The ones that were only that (ids 13, 42-44, 48, 55, 65, 72)
# left this file; the rest stay for what else they are.
# The publishers of the media I consumed (function publisher: ids 59, 82, 102, 108-111, 113) were removed on 2026-11-22:
# they live in My World (myworld.stream) now, as organizations of type Publisher.
# id 105 (AWS Solutions Architect) was merged into id 100 (Amazon Web Services) on 2026-11-08: an organization
# is the company that certified me, and the certifications themselves are in certifications.yaml, which points
# at the issuer by id.
# id 125 (Tel Aviv University) was added on 2026-11-07, and id 126 (Rimon School of Music) on 2026-11-08; with the
# Hebrew and Open universities they have function education (a school I studied at).
# ids 122-124 (AgileSparks, DevelopIntelligence, Logtel) were added on 2026-11-07 as training providers, and Hinbit,
# Interbit, John Bryce and Ness moved from teaching to training-provider the same day (all seven left on 2026-11-23).
# Extracted from the myworld MySQL database (TbOrganization, backup of 2019-05-11);
# ids 116-121 were added on 2026-11-07 from companies_i_taught.txt in the private ../data repo, so they
# have no old_url.
# status/location/website fields researched on the web on 2026-09-19.
# logos/<slug>.svg (paths relative to data/): genuine vector logos fetched 2026-09-20 where one exists
# (logo_kind/logo_source say which); the rest are colour traces of the original bitmaps (removed 2026-11-08,
# still in git history under data/raw/logos/).
# Every logo sits on the same 1000x1000 canvas (content fitted with a 6% margin, centred) on a transparent
# background; the traces have the bitmap's white/black surround keyed out before tracing (2026-09-20).
# <field>_geo blocks (place, lat, lon) are written by scripts/organizations_geocode.py from Nominatim (2026-09-25); place is
# the prose reduced to one city - correct by hand if a point is wrong, a re-run without --force keeps it.
# address is the street address of the office the geo point stands for (the last known one for an organization
# that is gone), researched on 2026-11-07, with address_source the page it was seen on.
# geo (from, place, lat, lon) is the one point a map should show for the organization, chosen by hand with
# scripts/organizations_pick_geo.py from those blocks; from names the field it was taken from.
# The schema (web-schemas/docs/json/organizations.json) requires geo on every organization, so the build fails
# when one has no map point.
$schema: https://veltzer.github.io/web-schemas/json/organizations.json
