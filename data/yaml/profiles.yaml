---
# next line is neccessary for vscode which does not read the $schema attribute
# yaml-language-server: $schema=https://veltzer.github.io/web-schemas/json/any.json
$schema: "https://veltzer.github.io/web-schemas/json/any.json"

# Profile links. Two repositories read this file, and each builds its own
# artifact from it -- neither writes into the other:
#
#   veltzer/          -> README.md, the GitHub profile page
#                        (rsconstruct build, scripts/gen_readme.py)
#   veltzer.github.io -> content/about/_index.{en,he}.md, the site About page
#                        (scripts/gen_profiles.py)
#
# Edit here, never in the generated files. Each group carries an English and a
# Hebrew heading so /he/about/ is a real translated page rather than an English
# list under a Hebrew title.
#
# intro and extras hold the prose and badges that surround the link list. They
# live here for the same reason the links do: both pages render them, so a
# single source is what keeps the two from drifting apart.

# Lead-in line above the link list, on both pages.
intro:
  text_en: "Various profiles of mine"
  text_he: "פרופילים שונים שלי"

# Contact line above the link list: the sentence, then a link whose text is
# link_text. Used to be a gitter badge; that room is gone.
contact:
  text_en: "To contact me, write to"
  text_he: "ליצירת קשר כתבו אל"
  link_text: "mark.veltzer@gmail.com"
  url: "mailto:mark.veltzer@gmail.com"

# Lines and badges below the link list, in render order.
extras:
  - id: israel
    text_en: "It seems like I'm one of the leading github commiters from Israel ->"
    text_he: "נראה שאני אחד מהמתכנתים המובילים בגיטהאב מישראל ->"
    link_text_en: "top GitHub users in Israel"
    link_text_he: "משתמשי הגיטהאב המובילים בישראל"
    url: "https://github.com/gayanvoice/top-github-users/blob/main/markdown/public_contributions/israel.md"
  - id: stats
    badge_alt: "GitHub stats"
    badge_url: "https://github-readme-stats.vercel.app/api?username=veltzer"
    url: "https://github.com/anuraghazra/github-readme-stats"
  - id: viewcounter
    # Rendered as a heading on the GitHub profile, matching how it has always
    # appeared there. The comment above it in README.md.in explains the link.
    heading: true
    badge_alt: "Profile view counter"
    badge_url: "https://komarev.com/ghpvc/?username=veltzer"

