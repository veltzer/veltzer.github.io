---
site_name: "Mark Veltzer's personal site"
site_url: "https://veltzer.org"
site_description: "Mark Veltzer's personal website — blog, media tracker, calendar, and chess viewer"
copyright: "Copyright &copy; 2026 Mark Veltzer"
extra_css:
  - "custom.css"
theme:
  name: "material"
extra:
  social:
    - icon: fontawesome/solid/square-rss
      link: https://veltzer.org/feed_rss_created.xml
      name: RSS Feed
docs_dir: "blog"
site_dir: "_site"
plugins:
  # i18n must come first: it reconfigures the Material theme (lang,
  # extra.alternate) and rewrites the file set that later plugins consume.
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      # Posts with no .he.md counterpart fall back to their English text rather
      # than 404ing, so /he/ is usable while translation is incomplete.
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: he
          name: עברית
          build: true
  - search:
  - blog:
      blog_dir: .
  - tags:
  - glightbox:
  - rss:
      match_path: "posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - tags
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - 'Home': 'index.md'
  - 'About Me': 'about.md'
  - 'Tags': 'tags.md'
  - 'Media': 'media.md'
  - 'Calendar': 'calendar.md'
  - 'Teaching Slides': 'slides.md'
  - 'Teaching Syllabi': 'syllabi.md'
  - 'Teaching Animations': 'animations.md'
