---
site_name: "Mark Veltzer's personal site"
site_url: "https://veltzer.org"
site_description: "Mark Veltzer's personal website — blog, media tracker, calendar, and chess viewer"
copyright: "Copyright &copy; 2026 Mark Veltzer"
extra_css:
  - "custom.css"
theme:
  name: "material"
  # overrides/main.html adds per-post lang/dir so Hebrew posts render RTL
  # without flipping the whole (mostly English) site. See doc/IMPROVEMENTS.md.
  custom_dir: "overrides"
extra:
  social:
    - icon: fontawesome/solid/square-rss
      link: https://veltzer.org/feed_rss_created.xml
      name: RSS Feed
docs_dir: "blog"
site_dir: "_site"
plugins:
  # NOTE: do not add mkdocs-static-i18n here. It is incompatible with the blog
  # plugin below: blog generates its post, archive and pagination pages
  # virtually at build time, and i18n cannot handle them -- it logs 34
  # "Unhandled file case" warnings and the build emits ZERO post pages, silently
  # dropping all 80 posts while still exiting 0. Verified with i18n placed both
  # before and after blog; same result either way. Upstream issue:
  # https://github.com/squidfunk/mkdocs-material/issues/4863
  - search:
  - blog:
      blog_dir: .
  - tags:
  - glightbox:
  - rss:
      match_path: "posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - tags
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - 'Home': 'index.md'
  - 'About Me': 'about.md'
  - 'Tags': 'tags.md'
  - 'Media': 'media.md'
  - 'Calendar': 'calendar.md'
  - 'Teaching Slides': 'slides.md'
  - 'Teaching Syllabi': 'syllabi.md'
  - 'Teaching Animations': 'animations.md'
